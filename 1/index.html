.top nav a:hover{background:var(--cool)}

.row{display:flex;flex-wrap:wrap;gap:10px}
.cover{display:block;border-radius:18px;overflow:hidden;box-shadow:0 2px 4px rgba(17,33,66,.08),0 30px 60px rgba(17,33,66,.22);transform:rotate(1.2deg);transition:transform .2s}
.cover:hover{transform:rotate(0) translateY(-3px)}
.cover img{display:block;width:100%;height:auto}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #E3E6EE;display:flex;flex-direction:column;text-decoration:none;transition:transform .15s,box-shadow .15s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(17,33,66,.12)}
.card .im{aspect-ratio:16/10;background:#CFD4DE center/cover no-repeat;position:relative}
.card .pg{position:absolute;left:14px;top:14px;background:rgba(17,33,66,.85);color:#fff;font-family:'Raleway',Arial,sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em;padding:5px 10px;border-radius:999px}

.card p{margin:0;font-size:14.5px;color:var(--mute)}

.card.wide{grid-column:span 2}
.card.wide .im{aspect-ratio:16/8}

.band{background:var(--navy);color:#E9EDF5;border-radius:24px;padding:48px 52px;display:grid;grid-template-columns:1.1fr 1fr;gap:44px;position:relative;overflow:hidden}

.chips a:hover{border-color:var(--gold);color:var(--gold)}
.nums{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}
.nums div{border-top:4px solid var(--blue);padding-top:12px}

.nums b{display:block;font-family:'Raleway',Arial,sans-serif;font-weight:800;font-size:34px;letter-spacing:-.03em;color:var(--navy);line-height:1}
.nums span{display:block;font-size:13px;color:var(--mute);margin-top:8px;line-height:1.4}
.enq{display:grid;grid-template-columns:1fr 1fr;border-radius:24px;overflow:hidden;background:var(--navy);color:#E9EDF5}
.enq .im{background:url(/assets/img/enquire-faces-x-3120.jpg) center/cover;min-height:300px}
.enq .bd{padding:40px 42px}
.enq h2{color:#fff;font-size:36px;font-weight:800;letter-spacing:-.02em}
.enq form{display:flex;margin:20px 0 12px}
